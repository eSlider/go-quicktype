name: Setup
description: Setup common stuff for jobs
inputs:
    node-version:
        description: Node.js version to install; defaults to .nvmrc
        required: false
        default: ""
runs:
    using: "composite"
    steps:
        - name: Setup Bun
          uses: oven-sh/setup-bun@v2
          with:
              bun-version: "1.4.0"

        - name: Setup environment
          shell: bash
          run: |
              NODE_VERSION="${{ inputs.node-version }}"
              if [[ -z "$NODE_VERSION" ]]; then
                  NODE_VERSION=$(cat .nvmrc | xargs)
              fi
              echo "node_version=$NODE_VERSION" >> $GITHUB_ENV

        - name: Setup node
          uses: actions/setup-node@v4
          with:
              node-version: ${{ env.node_version }}

        - name: Install Dependencies
          run: bun install --frozen-lockfile
          shell: bash

        - name: Normalize sibling workspace links
          shell: bash
          run: |
              for pkg in quicktype-core quicktype-graphql-input quicktype-typescript-input; do
                  find packages -type d -path "*/node_modules/$pkg" -prune -exec rm -rf {} +
              done

        - name: Build Packages
          run: bun run build
          shell: bash
